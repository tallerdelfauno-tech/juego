<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Taller del Fauno · Juego</title>
<meta name="description" content="Acerca tu llavero cartucho del Taller del Fauno y juega.">
<meta name="theme-color" content="#1b2a1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#121a12; --panel:#1b2a1b; --pantalla:#9bbc0f; --pantalla-osc:#306230;
    --texto:#e8f0d8; --suave:#a9b89a; --acento:#8bac0f; --borde:#2f4a2f; --boton:#2b3d2b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100dvh;padding:16px}
  header{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
  header img{width:52px;height:52px;border-radius:12px;background:#000}
  header h1{font-size:1.15rem;margin:0;line-height:1.2}
  header p{margin:2px 0 0;color:var(--suave);font-size:.85rem}
  .cartucho{width:100%;max-width:520px;background:var(--panel);border:2px solid var(--borde);border-radius:18px 18px 40px 18px;padding:16px}
  #inicio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:28px 12px;
          background:var(--pantalla);color:var(--pantalla-osc);border-radius:8px;font-weight:700}
  #inicio .grande{font-size:1.4rem;letter-spacing:.04em}
  #inicio .chico{font-weight:500;font-size:.9rem;max-width:30ch}
  .btn,.archivo{appearance:none;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
  .btn{background:var(--pantalla-osc);color:var(--pantalla)}
  .archivo{background:transparent;color:var(--pantalla-osc);border:2px solid var(--pantalla-osc);display:inline-block}
  .archivo input{display:none}
  #estado{min-height:1.2em;font-size:.85rem;color:var(--pantalla-osc)}
  footer{margin-top:auto;padding-top:20px;color:var(--suave);font-size:.75rem;text-align:center;max-width:520px}
  footer a{color:var(--acento)}

  /* consola en pantalla completa */
  #consola{display:none;position:fixed;inset:0;z-index:10;background:var(--panel);
           flex-direction:column;align-items:center;justify-content:space-between;
           padding:max(12px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));
           user-select:none;-webkit-user-select:none;touch-action:none}
  body.jugando{overflow:hidden}
  body.jugando #consola{display:flex}
  #pantalla{width:min(100%, calc((100dvh - 300px) * 160 / 144));aspect-ratio:160/144;background:#000;border-radius:6px;
            border:10px solid #0d140d;box-shadow:0 0 0 2px var(--borde)}
  #pantalla canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  #controles{width:100%;max-width:420px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px;padding:8px 4px}
  .cruz{position:relative;width:150px;height:150px;justify-self:start}
  .cruz button{position:absolute;width:50px;height:50px;background:var(--boton);border:0;border-radius:8px;color:var(--suave);font-size:1.1rem}
  .cruz .UP{left:50px;top:0}.cruz .DOWN{left:50px;bottom:0}.cruz .LEFT{left:0;top:50px}.cruz .RIGHT{right:0;top:50px}
  .ab{position:relative;width:150px;height:120px;justify-self:end}
  .ab button{position:absolute;width:62px;height:62px;border-radius:50%;border:0;background:#6b1f3a;color:#f3d6e0;font-weight:800;font-size:1.1rem}
  .ab .A{right:0;top:8px}.ab .B{left:0;top:44px}
  .menu{grid-column:1/3;display:flex;justify-content:center;gap:22px}
  .menu button{border:0;border-radius:999px;background:var(--boton);color:var(--suave);font-size:.75rem;font-weight:700;padding:8px 16px;letter-spacing:.05em}
  #consola button.on{filter:brightness(1.6)}
  #salir{position:absolute;top:max(8px,env(safe-area-inset-top));right:10px;border:0;background:transparent;color:var(--suave);font-size:1.4rem}

  /* Game Boy Advance: EmulatorJS dibuja su propia pantalla y controles */
  #consolaGba{display:none;position:fixed;inset:0;z-index:10;background:#000;
              padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  body.jugandoGba{overflow:hidden}
  body.jugandoGba #consolaGba{display:block}
  #contenedorGba{width:100%;height:100%}
  #salirGba{position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;z-index:20;border:0;background:rgba(0,0,0,.5);
            border-radius:50%;width:38px;height:38px;color:#fff;font-size:1.1rem}
</style>
</head>
<body>
<header>
  <img src="logo.webp" alt="Logo Taller del Fauno">
  <div>
    <h1>Taller del Fauno · Impresiones 3D</h1>
    <p>Rancagua, Chile · @eltallerdelfauno3d</p>
  </div>
</header>

<main class="cartucho">
  <div id="inicio">
    <div class="grande">▶ PRESIONA JUGAR</div>
    <div class="chico" id="mensaje">Tu llavero cartucho está listo.</div>
    <button class="btn" id="btnJugar" hidden>Jugar</button>
    <label class="archivo" id="btnArchivo" hidden>Cargar mi juego (.gb / .gbc / .gba)
      <input type="file" id="archivo" accept=".gb,.gbc,.gba">
    </label>
    <div id="estado"></div>
  </div>
</main>

<div id="consola">
  <button id="salir" aria-label="Salir">✕</button>
  <div id="pantalla"><canvas id="lienzo" width="160" height="144"></canvas></div>
  <div id="controles">
    <div class="cruz">
      <button class="UP" data-b="UP">▲</button><button class="LEFT" data-b="LEFT">◀</button>
      <button class="RIGHT" data-b="RIGHT">▶</button><button class="DOWN" data-b="DOWN">▼</button>
    </div>
    <div class="ab"><button class="B" data-b="B">B</button><button class="A" data-b="A">A</button></div>
    <div class="menu"><button data-b="SELECT">SELECT</button><button data-b="START">START</button></div>
  </div>
</div>

<div id="consolaGba">
  <button id="salirGba" aria-label="Salir">✕</button>
  <div id="contenedorGba"></div>
</div>

<footer>
  Emuladores: <a href="https://github.com/torch2424/wasmboy" target="_blank" rel="noopener">WasmBoy</a> (GPL-3.0) para Game Boy y
  <a href="https://github.com/EmulatorJS/EmulatorJS" target="_blank" rel="noopener">EmulatorJS</a> (GPL-3.0) con
  <a href="https://github.com/EmulatorJS/mgba" target="_blank" rel="noopener">mGBA</a> (MPL-2.0) para Game Boy Advance.
  Este sitio no incluye ni distribuye juegos comerciales de terceros.
</footer>

<script src="https://cdn.jsdelivr.net/npm/wasmboy@0.7.1/dist/wasmboy.wasm.iife.js"></script>
<script>
// Juego propio del Taller (por ejemplo, hecho con GB Studio). Si existe, el llavero lo abre directo.
// Cada sticker puede abrir un juego distinto: ...github.io/juego/?j=nombre carga juegos/nombre.gb o juegos/nombre.gba
const pedido = (new URLSearchParams(location.search).get('j') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '');
const BASE_JUEGO = pedido ? 'juegos/' + pedido : 'juego';

const $ = id => document.getElementById(id);
const GB = window.WasmBoy && (window.WasmBoy.WasmBoy || window.WasmBoy);

// estado de los botones; lo mandamos al emulador en cada cuadro
const botones = {UP:false, RIGHT:false, DOWN:false, LEFT:false, A:false, B:false, SELECT:false, START:false};
function bucleControles(){ if (GB && GB.isPlaying()) GB.setJoypadState(botones); requestAnimationFrame(bucleControles); }

// botones táctiles (permite deslizar el dedo de un botón a otro)
const activos = new Map();
function revisarToques(e){
  e.preventDefault();
  for (const k in botones) if (k !== '_') botones[k] = false;
  for (const t of e.touches) { const el = document.elementFromPoint(t.clientX, t.clientY); const b = el && el.dataset && el.dataset.b; if (b) botones[b] = true; }
  document.querySelectorAll('#controles button').forEach(b => b.classList.toggle('on', botones[b.dataset.b]));
}
['touchstart','touchmove','touchend','touchcancel'].forEach(ev => $('controles').addEventListener(ev, revisarToques, {passive:false}));
// mouse (para probar en el computador)
$('controles').addEventListener('mousedown', e => { const b = e.target.dataset.b; if (b) { botones[b] = true; e.target.classList.add('on'); } });
addEventListener('mouseup', () => { for (const k in botones) botones[k] = false; document.querySelectorAll('#controles button').forEach(b => b.classList.remove('on')); });
// teclado: flechas, Z = B, X = A, Enter = Start, Shift = Select
const teclas = {ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT', z:'B', x:'A', Enter:'START', Shift:'SELECT'};
addEventListener('keydown', e => { const b = teclas[e.key] || teclas[e.key.toLowerCase()]; if (b) { botones[b] = true; e.preventDefault(); } });
addEventListener('keyup',   e => { const b = teclas[e.key] || teclas[e.key.toLowerCase()]; if (b) botones[b] = false; });

async function arrancar(rom){
  if (!GB) { $('estado').textContent = 'No se pudo cargar el emulador. Revisa tu conexión.'; return; }
  document.body.classList.add('jugando');
  // pantalla completa real donde el navegador lo permite (Android); en iPhone la consola igual llena la pantalla
  const c = $('consola'), pedir = c.requestFullscreen || c.webkitRequestFullscreen;
  if (pedir) { try { const p = pedir.call(c, {navigationUI:'hide'}); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  try {
    await GB.config({headless:false, isAudioEnabled:true, frameSkip:0, gameboyFrameRate:60, isGbcEnabled:true}, $('lienzo'));
    GB.disableDefaultJoypad();
    await GB.loadROM(rom);
    await GB.play();
    GB.resumeAudioContext && GB.resumeAudioContext();
    requestAnimationFrame(bucleControles);
  } catch (e) {
    salir();
    $('estado').textContent = 'No se pudo abrir el juego.';
  }
}
function salir(){
  if (GB && GB.isPlaying()) GB.pause();
  document.body.classList.remove('jugando');
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
$('salir').addEventListener('click', salir);

// Game Boy Advance: EmulatorJS se carga solo cuando hace falta. Muestra su propio botón de inicio,
// porque iPhone exige un toque justo antes de activar el sonido.
function arrancarGba(rom){
  document.body.classList.add('jugandoGba');
  Object.assign(window, {
    EJS_player: '#contenedorGba',
    EJS_core: 'gba',
    EJS_gameUrl: rom,
    EJS_gameName: rom instanceof File ? rom.name : BASE_JUEGO.split('/').pop(),
    EJS_pathtodata: 'emulador-gba/',
    EJS_language: 'es-ES',
    EJS_startButtonName: 'Empezar',
    EJS_color: '#8bac0f',
    EJS_backgroundColor: '#000000',
    EJS_onGameStart: () => { if ('ontouchstart' in window) setTimeout(() => window.EJS_emulator.toggleVirtualGamepad(true), 300); }, // controles táctiles siempre visibles en teléfonos
    EJS_Buttons: {netplay:false, cheat:false, screenRecord:false, saveState:false, loadState:false, cacheManager:false, exitEmulation:false}
  });
  const s = document.createElement('script');
  s.src = 'emulador-gba/loader.js';
  s.onerror = () => { document.body.classList.remove('jugandoGba'); $('estado').textContent = 'No se pudo cargar el emulador. Revisa tu conexión.'; };
  document.body.appendChild(s);
}
// EmulatorJS no se puede detener y volver a abrir en la misma página: al salir, recargamos.
$('salirGba').addEventListener('click', () => location.reload());

const existe = url => fetch(url, {method:'HEAD', cache:'no-store'}).then(r => r.ok).catch(() => false);
let juegoPublicado = null;

// ¿Hay juego propio publicado junto a la página? Primero .gb, después .gba.
(async () => {
  for (const ext of ['.gb', '.gba']) if (await existe(BASE_JUEGO + ext)) { juegoPublicado = BASE_JUEGO + ext; break; }
  $('mensaje').textContent = juegoPublicado ? 'Tu llavero cartucho está listo.' : 'Carga tu propio archivo de juego para empezar.';
  $('btnJugar').hidden = !juegoPublicado;
  $('btnArchivo').hidden = false;
})();

$('btnJugar').addEventListener('click', () => juegoPublicado.endsWith('.gba') ? arrancarGba(juegoPublicado) : arrancar(juegoPublicado));
$('archivo').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) /\.gba$/i.test(f.name) ? arrancarGba(f) : arrancar(f);
});
</script>
</body>
</html>
